baseURL = 'https://synergyvr.org/mgo/'
CanonifyURLs=true
locale = 'en-us'
title = "Mad God's Overhaul for Skyrim VR"
theme = 'relearn'
# The shared Synergy layer (shortcodes, styles, scripts, layout overrides) is a
# Hugo Module. It must resolve ahead of Relearn so its overrides win, which is
# what listing it here while Relearn stays in `theme` above achieves.
#
# To work against a local checkout of the module, set HUGO_MODULE_REPLACEMENTS in
# the environment rather than adding a `replacements` line here, so a dev-only
# path can never end up committed. The module's README has the full command.
[module]
  [[module.imports]]
    path = 'github.com/synergyvr-org/synergy-hugo-shared'

[params]
  themeVariant = 'zen-dark'
  disableInlineCopyToClipBoard = true

  # Keep sub-tables last: in TOML every key after a [params.x] header belongs to
  # that sub-table, so scalars above would be swallowed.
  #
  # Cover-banner screenshots for this list, randomized per page load by the
  # shared custom.js. These are MGO's own screenshots. The Skyrim art behind
  # alert asides comes from the shared module (its data/synergy.yaml); override
  # it here with `asideArt = [...]` if this site ever wants its own.
  [params.synergy]
    # Sidebar logo (the shared module no longer hardcodes one)
    logo = 'tes5-mgo-300.webp'
    logo2x = 'tes5-mgo-300@2x.webp'
    logoAlt = "Mad God's Overhaul for Skyrim VR"
    footerCredit = 'MGO by [Synergy Team](https://synergyvr.org/)'
    footerCredit2 = 'Docs by Davey'
    # Each cover ships an @2x sibling so the banner can use image-set(). The
    # sources cap out at 2560-3431px, so @2x is 1.4x-1.9x the 1x rather than a
    # true 2x — still the sharpest these captures allow.
    coverRetina = '@2x'
    coverImages = [
      'ss-ridge-pine.webp',
      'ss-sunset-range.webp',
      'ss-hazy-pass.webp',
      'ss-green-ridge.webp',
      'ss-grass-overlook.webp',
      'ss-pine-slope.webp',
      'ss-forest-floor.webp',
      'ss-shrine-ledge.webp',
      'ss-dusk-heath.webp',
      'ss-frozen-ruin.webp',
      'ss-snowy-shrine.webp',
      'ss-sunset-summit.webp',
      'ss-village-braziers.webp',
      'ss-longhouse.webp',
      'ss-aurora-steading.webp',
      'ss-night-gate.webp',
      'ss-aurora-lake.webp',
      'ss-frozen-shore.webp',
      'ss-frozen-tower.webp',
    ]

    # Load-order separator colors. One continuous gradient across the top-level
    # folders, plus the START HERE subtree's gold gradient. These are the values
    # the shortcode used to hardcode, so the rendering is unchanged.
    [params.synergy.modlist]
      subtree = ['#e1be7a', '#594328']
      subtreeRoot = 'START HERE - Expand for Setup'
      titlePrefix = 'Mad God Overhaul - '
      plain = ['End Of List']
      [[params.synergy.modlist.bands]]
        stops = ['#642f69', '#000000', '#581e2a']

    # The FUS load-order section shows FUS's colors instead
    [params.synergy.brandLogos.fus]
      src = 'fus-splash.webp'
      alt = 'FUS, a modlist for Skyrim VR by Kvitekvist and Cangar'
[caches]
  [caches.images]
    dir = ':cacheDir/images'
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false