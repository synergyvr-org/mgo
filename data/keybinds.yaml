  note: Mod authors document these for a standard gamepad. They aren't VR controller buttons (gamepad X isn't the X button on a Quest controller), and the VR versions of these menus may work differently.
  inputs:
  - input: A
    uses:
    - mod: RaceMenu
      action: Accept character edit
      nexus: 19080
      context: Inside RaceMenu. Standard gamepad equivalents; the VR adaptation may differ. Standard gamepad input; not a verified Quest mapping.
  - input: Back
    uses:
    - mod: RaceMenu
      action: Toggle character lighting
      nexus: 19080
      context: Inside RaceMenu. Standard gamepad equivalents; the VR adaptation may differ. Standard gamepad input; not a verified Quest mapping.
    - mod: SkyUI VR
      action: Switch tab
      nexus: 91535
      context: SkyUI menus / favorites. Standard gamepad input; not a verified Quest mapping.
  - input: LB
    uses:
    - mod: RaceMenu
      action: Export the head
      nexus: 19080
      context: Inside RaceMenu. Standard gamepad equivalents; the VR adaptation may differ. Standard gamepad input; not a verified Quest mapping.
    - mod: SkyUI VR
      action: Previous column
      nexus: 91535
      context: SkyUI menus / favorites. Standard gamepad input; not a verified Quest mapping.
  - input: Left Stick press
    uses:
    - mod: RaceMenu
      action: Load a preset
      nexus: 19080
      context: Inside RaceMenu. Keyboard follows the Quickload action. Standard gamepad input; not a verified Quest mapping.
    - mod: SkyUI VR
      action: Change sort order
      nexus: 91535
      context: SkyUI menus / favorites. Standard gamepad input; not a verified Quest mapping.
  - input: Left Trigger
    uses:
    - mod: RaceMenu
      action: Change subcategory
      nexus: 19080
      context: Inside RaceMenu. These are standard gamepad triggers, not a verified Quest mapping. Standard gamepad input; not a verified Quest mapping.
  - input: RB
    uses:
    - mod: RaceMenu
      action: Zoom character view
      nexus: 19080
      context: Inside RaceMenu. Standard gamepad equivalents; the VR adaptation may differ. Standard gamepad input; not a verified Quest mapping.
    - mod: SkyUI VR
      action: Next column
      nexus: 91535
      context: SkyUI menus / favorites. Standard gamepad input; not a verified Quest mapping.
  - input: Right Stick press
    uses:
    - mod: RaceMenu
