# Default keybindings for MGO's mods, from a spreadsheet compiled by Don Quibrote
# (assets/mgo-default-keybinds.xlsx). Rendered by the `keybinds` shortcode.
# Rows the spreadsheet marks "No recorded assignment" are left out on purpose: the sheet
# itself warns that they don't mean a key is free. `nexus` IDs and `optional` (the mod ships
# disabled) come from MGO's load order CSVs. `keys` lists the parts of an input to draw as
# keycaps.
# `label`, when present, is how a VR input is displayed: `{name}` draws that controller
# glyph (the same images as the `control` shortcode). `input` stays plain for the filter.

categories:
- id: vr
  title: VR controllers
  note: Plenty of inputs show up more than once here, usually because each mod only claims the input in its own situation (holding a book, gripping a climbable surface, browsing a menu). Shared doesn't mean conflicting.
  inputs:
  - input: Either Trigger
    label: Either {trigger}
    uses:
    - mod: Gift By Hand VR
      action: Open summon menu
      nexus: 99809
      context: Both hands near the head on press and release. Hold over 2 and under 20 seconds, then release.
    - mod: Gift By Hand VR
      action: Summon last grabbed NPC
      nexus: 99809
      context: Both hands near the head on press and release. Hold over 1 and up to 2 seconds, then release.
  - input: Existing Activate input
    uses:
    - mod: Inigo
      action: Enter follower command mode
      nexus: 1461
      context: Hold Activate while targeting a follower. Reuses the game interaction mapping.
  - input: Existing HIGGS dual-grip input
    uses:
    - mod: Conduit - Short-term Weapon Infusions
      action: Use grip conduction
      nexus: 58023
      context: Grip-conduction starts disabled. Enable the feature, then grasp a weapon with the spell hand; no new hotkey assignment is required.
  - input: Existing HIGGS grab input — Triple grasp
    uses:
    - mod: Gift By Hand VR
      action: Loot a body
      nexus: 99809
      context: Grasp a dead body three times to loot it. Uses the existing HIGGS grab input.
    - mod: Gift By Hand VR
      action: Open follower inventory
      nexus: 99809
      context: Grasp a follower's shoulder three times to open inventory. Uses the existing HIGGS grab input.
  - input: Existing Jump input
    uses:
    - mod: Steeds of Ultima - VR Mounted Combat
      action: Kick while mounted
      nexus: 81220
      context: Mounted kicking is enabled. The physical Quest button follows the active Jump mapping.
  - input: Existing Sheathe input
    uses:
    - mod: Forget Spell
      action: Open forget-spell prompt
      nexus: 51125
      context: In the Magic menu. Standard gamepad uses X; that is not a Quest X-button assignment.
  - input: Existing Shout input
    uses:
    - mod: Steeds of Ultima - VR Mounted Combat
      action: Shout while mounted
      nexus: 81220
      context: Uses the original Shout mapping. A separate custom shout button is inactive by default.
  - input: Grip
    label: '{grip}'
    uses:
    - mod: HIGGS - Hand Interaction and Gravity Gloves for Skyrim VR
      action: Grab / select an object
      nexus: 43930
      context: Exact behavior depends on hand state and controller settings. Quest uses grip press; Index grip-touch behavior should not be applied to Quest.
    - mod: HIGGS - Hand Interaction and Gravity Gloves for Skyrim VR
      action: Pull an object with gravity gloves
      nexus: 43930
      context: Select or grab at a distance, hold, then pull. Behavior depends on hand state and controller settings. Trigger or Grip depends on hand state.
    - mod: Immersive Reading
      action: Drop the book
      nexus: 173931
      context: Press while holding a book in reading mode.
    - mod: Immersive Reading
      action: Put the book in inventory
      nexus: 173931
      context: Press over the shoulder while holding the book.
    - mod: Immersive Reading
      action: Return to normal HIGGS grabbing
      nexus: 173931
      context: Hold while holding a book in reading mode.
    - mod: VR Climbing
      action: Latch onto a surface / climb
      nexus: 168553
      context: Grip near a solid surface, then pull with that hand.
    - mod: VRIK
      action: Reposition a weapon holster
      nexus: 23416
      context: Hold Grip near the holster to reposition it.
    - mod: VRIK
      action: Store / draw a holstered weapon
      nexus: 23416
      context: Grip near a holster; pull to draw. Gesture functions require their own assignments.
  - input: Grip (either hand)
    label: '{grip} (either hand)'
    uses:
    - mod: Immersive Harvesting VR
      action: Harvest a touched target
      nexus: 186754
      context: Touch a supported target. Full immersive harvesting also requires the physical pull.
  - input: Grip + A/X (either hand)
    label: '{grip} + {a}/{x} (either hand)'
    uses:
    - mod: SeverActions
      action: Open wheel menu
      optional: true
      context: SeverActions 4.x documented default. Opens the quick wheel. Keyboard wheel shortcut starts unassigned.
  - input: Grip + B/Y (either hand)
    label: '{grip} + {b}/{y} (either hand)'
    uses:
    - mod: SeverActions
      action: Open configuration menu
      optional: true
      context: SeverActions 4.x documented default. Opens the menu.
  - input: Grip + Trigger (either hand)
    label: '{grip} + {trigger} (either hand)'
    uses:
    - mod: Spell Wheel VR
      action: Open the wheel
      nexus: 47630
      context: Press Grip first, then Trigger on the same hand. Default is assigned on both hands.
  - input: Left Trigger
    label: '{left-trigger}'
    uses:
    - mod: Be Seated Skyrim VR Edition
      action: Call a tavern worker
      nexus: 16613
      context: While seated at a tavern.
    - mod: Immersive Reading
      action: Close the book
      nexus: 173931
      context: Press or hold about one second in reading mode.
    - mod: Immersive Reading
      action: Turn to the previous page
      nexus: 173931
      context: With the book open in reading mode.
    - mod: Local Map Upgrade VR
      action: Place a local-map marker
      nexus: 134212
      context: While using the local map.
    - mod: NavigateVR - Dynamic Compass and Equipable Maps
      action: Cycle equipped hold maps
      nexus: 47174
      context: Hold a map in hand and use combat stance. Optional remapping can change these inputs.
  - input: Move left beyond the first category
    uses:
    - mod: SkyUI VR
      action: Toggle trade direction
      nexus: 91535
      context: Directional menu input; physical stick / button follows the active control mapping.
  - input: Move up at the top of the item list
    uses:
    - mod: SkyUI VR
      action: Change sort order
      nexus: 91535
      context: SkyUI menus / favorites.
  - input: Quick double-up at the top of the item list
    uses:
    - mod: SkyUI VR
      action: Reverse sort direction
      nexus: 91535
      context: VR directional menu input; physical control follows the active mapping.
  - input: Release wheel activation controls
    uses:
    - mod: Spell Wheel VR
      action: Select a wheel orb
      nexus: 47630
      context: Point at the desired orb while the wheel is open, then release.
  - input: Right Trigger
    label: '{right-trigger}'
    uses:
    - mod: Be Seated Skyrim VR Edition
      action: Open tavern service menu
      nexus: 16613
      context: Hold about 3 seconds while seated at a tavern.
    - mod: Immersive Reading
      action: Open the book
      nexus: 173931
      context: With a closed book in reading mode.
    - mod: Immersive Reading
      action: Turn to the next page
      nexus: 173931
      context: With the book open in reading mode.
    - mod: Local Map Upgrade VR
      action: Drag / move the local map
      nexus: 134212
      context: While using the local map, including indoors.
    - mod: NavigateVR - Dynamic Compass and Equipable Maps
      action: Cycle equipped hold maps
      nexus: 47174
      context: Hold a map in hand and use combat stance. Optional remapping can change these inputs.
    - mod: Simple Realistic Archery VR
      action: Equip the last arrow
      nexus: 28524
      context: Press over the shoulder. Custom arrow slots start empty.
  - input: Trigger
    label: '{trigger}'
    uses:
    - mod: HIGGS - Hand Interaction and Gravity Gloves for Skyrim VR
      action: Grab / select an object
      nexus: 43930
      context: Exact behavior depends on hand state and controller settings. Quest uses grip press; Index grip-touch behavior should not be applied to Quest.
    - mod: HIGGS - Hand Interaction and Gravity Gloves for Skyrim VR
      action: Pull an object with gravity gloves
      nexus: 43930
      context: Select or grab at a distance, hold, then pull. Behavior depends on hand state and controller settings. Trigger or Grip depends on hand state.
    - mod: Immersive Reading
      action: Enter / change reading mode
      nexus: 173931
      context: Use with a book. Keyboard pose shortcuts are disabled by default.
    - mod: OStim Standalone VR
      action: Select an OStim wheel orb
      nexus: 119892
      context: Open the OStim wheel through Spell Wheel first; its opening input follows Spell Wheel settings.
    - mod: Seamless Arrow Nocking VR
      action: Draw / fire with seamless arrow nocking
      nexus: 117254
      context: Auto-nocking is enabled; hold the existing quiver input while nocking, then release to shoot.
  - input: Trigger (either hand)
    label: '{trigger} (either hand)'
    uses:
    - mod: Weapon Throw VR
      action: Throw an equipped weapon
      nexus: 31374
      context: Hold, swing the equipped weapon, then release; assigned on both hands.
  - input: Trigger on the offhand
    label: '{trigger} on the offhand'
    uses:
    - mod: Immersive Crossbow Reload VR
      action: Grab a crossbow bolt
      nexus: 139152
      context: Reach to the lower back; release over the loading area.
    - mod: Immersive Crossbow Reload VR
      action: Grab the crossbow cocking lever
      nexus: 139152
      context: Pull the lever with the offhand.
